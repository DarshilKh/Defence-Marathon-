# ========================================
# PACKAGED BUILD CONFIG (standalone .exe)
# ========================================
# Shipped as <app>/config/application.properties and loaded by MarathonApplication.
# Self-contained: local SQLite database, no MySQL server, no credentials.
# The dev config (src/main/resources/application.properties, MySQL) is not used here
# and is excluded from the packaged jar.
#
# ${app.home} is the folder that holds lib/, data/, logs/ (set at startup from where
# the app is actually installed, not from the working directory).
spring.application.name=Indian Defence Marathon RFID System

spring.main.web-application-type=none
spring.main.banner-mode=off

# ========================================
# DATABASE: MySQL
# ========================================
database.mode=online

database.online.url=jdbc:mysql://localhost:3306/airforce_marathon?useSSL=false&serverTimezone=Asia/Kolkata&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
database.online.username=root
database.online.password=mysql

# ========================================
# HIBERNATE
# ========================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# ========================================
# LOGGING
# ========================================
logging.level.root=WARN
logging.level.com.army.marathon=DEBUG
logging.level.org.springframework=ERROR
logging.level.org.springframework.boot=INFO
logging.level.org.hibernate=ERROR
logging.level.org.hibernate.SQL=ERROR

logging.file.name=${app.home}/logs/airforce_marathon.log
logging.file.max-size=10MB
logging.file.max-history=30

logging.pattern.console=%clr(%d{HH:mm:ss}){faint} %clr(%-5level) : %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# ========================================
# JAVAFX
# ========================================
spring.main.allow-circular-references=true
javafx.title=Indian Defence Marathon RFID System
javafx.width=1400
javafx.height=900

# ========================================
# RFID READER SETTINGS
# ========================================
rfid.scan.timeout.ms=5000
rfid.reconnect.interval.ms=12000
rfid.max.reconnect.attempts=5
rfid.reader.power=30
rfid.antenna.count=4
rfid.duplicate.tag.threshold.ms=3000

# ========================================
# DEVICE SETTINGS
# ========================================
device.mode.configured=false
device.id=NOT_CONFIGURED
device.role=MASTER

# ========================================
# DATA SYNC SETTINGS
# ========================================
data.sync.usb.path=E:/
data.sync.auto.export=false
data.sync.export.interval.minutes=30

# ========================================
# RACE CALCULATION SETTINGS
# ========================================
race.calculation.mode=AUTO
race.required.checkpoints=2
race.include.dnf.in.report=true
